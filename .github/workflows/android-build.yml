name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release, debug, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 secret into app/release.keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            if [ -s app/release.keystore ]; then
              echo "keystore_decoded=true" >> "$GITHUB_OUTPUT"
              echo "Keystore decoded successfully (size: $(stat -c%s app/release.keystore) bytes)."
            else
              echo "keystore_decoded=false" >> "$GITHUB_OUTPUT"
              echo "Decoded keystore file is empty."
            fi
          else
            echo "keystore_decoded=false" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_BASE64 secret is not set. Release APK will be unsigned or debug-only."
          fi

      - name: Build with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          echo "Selected Build Type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          elif [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleRelease assembleDebug --stacktrace
          fi

      - name: Verify and Sign Fallback with apksigner
        if: steps.decode_keystore.outputs.keystore_decoded == 'true'
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*unsigned*.apk" 2>/dev/null | head -n 1 || true)
          SIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" 2>/dev/null | head -n 1 || true)
          
          if [ -n "$UNSIGNED_APK" ] && [ -f "$UNSIGNED_APK" ] && [ -z "$SIGNED_APK" ]; then
            echo "Signing unsigned APK with apksigner fallback..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              $APKSIGNER sign --ks app/release.keystore \
                --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                --out "app/build/outputs/apk/release/MTManager-release-signed.apk" \
                "$UNSIGNED_APK"
              echo "Signed APK successfully created: MTManager-release-signed.apk"
            else
              echo "apksigner tool not found in $ANDROID_HOME/build-tools."
            fi
          elif [ -n "$SIGNED_APK" ]; then
            echo "Signed APK already generated by Gradle: $SIGNED_APK"
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          # Copy release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" 2>/dev/null | head -n 1 || true)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/MTManager-release.apk
            echo "Copied Release APK: dist/MTManager-release.apk"
          fi
          
          # Copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" dist/MTManager-debug.apk
            echo "Copied Debug APK: dist/MTManager-debug.apk"
          fi
          
          echo "Final artifacts in dist/:"
          ls -lh dist/

      - name: Upload Release APK
        if: hashFiles('dist/*release*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: MTManager-Release-APK
          path: dist/*release*.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        if: hashFiles('dist/*debug*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: MTManager-Debug-APK
          path: dist/*debug*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
